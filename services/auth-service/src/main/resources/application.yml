spring:
  application:
    name: auth-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info